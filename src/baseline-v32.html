    <style>
        /* 載入芫荽體 Iansui */
        

        body {
            background-color: #f3f3f1; /* --paper */
            -webkit-tap-highlight-color: transparent;
            font-weight: 600;
        }

        .custom-scroller::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroller::-webkit-scrollbar-track { background: transparent; }
        .custom-scroller::-webkit-scrollbar-thumb { background: #c9cbc4; border-radius: 10px; }
        .custom-scroller::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        .btn-prominent {
            background-color: #191b1e; /* --ink */ 
            color: white;
            font-weight: 700;
            padding: 0.85rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-prominent:hover {
            background-color: #26282d;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-prominent:active { transform: translateY(0); }
        .btn-prominent:disabled { opacity: 0.5; transform: none; box-shadow: none; cursor: not-allowed; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 列印與 PDF 輸出專用排版 */
        @media print {
            @page { margin: 8mm; size: A4 portrait; }
            body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #report-container { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            .card { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 12px !important; }
            .page-break-before { page-break-before: always !important; }
            h1, h2, h3 { page-break-after: avoid !important; break-after: avoid !important; }
        }
        
        .pdf-export-mode {
            background-color: white !important;
            padding: 24px 20px !important;
            width: 800px !important;
            max-width: 800px !important;
            margin: 0 auto !important;
            box-sizing: border-box !important;
        }
        .pdf-export-mode .no-print { display: none !important; }
        .pdf-export-mode #report-container { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; max-width: none !important; }
        .pdf-export-mode .card { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 16px !important; }
        .pdf-export-mode .page-break-before { page-break-before: always !important; }
    </style>
